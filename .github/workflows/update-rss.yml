name: Update RSS site

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Fetch feeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_feeds.py
      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp index.html feeds.json _site/
          cp assets/app.js assets/style.css assets/favicon.svg _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
